<!DOCTYPE html>
<!--
  Page de secours servie par public/sw.js quand une navigation échoue faute de réseau — un fichier
  HTML statique volontairement autonome (pas une page Next : le rendu React/RSC a lui-même besoin
  du réseau), pour rester disponible même si rien d'autre n'a encore été mis en cache.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Onina.mg — Hors ligne</title>
    <link rel="icon" href="/manifest-icon-192.png" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f3e8d2;
        color: #2b1b12;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1c1410;
          color: #f3e8d2;
        }
      }
      .card {
        max-width: 360px;
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        opacity: 0.75;
        margin: 0 0 20px;
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        color: #fff;
        background: #c74f2d;
        border: none;
        border-radius: 12px;
        padding: 10px 20px;
        cursor: pointer;
      }
      button:active {
        background: #a83f21;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/manifest-icon-192.png" alt="Onina" />
      <h1>Vous êtes hors ligne</h1>
      <p>
        Cette page a besoin d'une connexion internet. Vérifiez votre connexion, puis réessayez.
      </p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
